<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
  <title>PFOS</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b132b; color: #f8fafc; }
    main { max-width: 430px; padding: 48px; text-align: center; }
    img { width: 92px; height: 92px; }
    h1 { font-size: 27px; letter-spacing: -.6px; margin-top: 28px; }
    p { color: #94a3b8; line-height: 1.7; margin-bottom: 30px; }
    a { display: inline-block; background: #36c8a0; color: #0b132b; text-decoration: none; padding: 12px 24px; border-radius: 9px; font-weight: 600; }
    a:focus-visible { outline: 3px solid white; outline-offset: 5px; }
  </style>
</head>
<body><main>
  <img src="assets/icon.png" alt="PFOS">
  <h1>PFOS couldn’t open</h1>
  <p>The local interface is unavailable. Start it, then try again.</p>
  <a href="https://pfos.invalid/retry">Try again</a>
</main></body>
</html>
